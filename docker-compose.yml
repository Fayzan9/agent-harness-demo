# Local stand-ins for AWS services. `docker compose up -d db` gives you Postgres (on AWS this is RDS).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness-local-only}  # a throwaway for your laptop; never reuse it anywhere real
      POSTGRES_DB: harness
    ports:
      - "127.0.0.1:5432:5432"  # only your own machine can connect, not the network
    volumes:
      - dbdata:/var/lib/postgresql/data  # keeps the data when the container is recreated
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 3s
      retries: 20

volumes:
  dbdata:
