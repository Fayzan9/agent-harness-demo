[alembic]
script_location = alembic
prepend_sys_path = .
# The database url is not here: alembic/env.py takes it from the app's settings (DATABASE_URL).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s %(message)s
